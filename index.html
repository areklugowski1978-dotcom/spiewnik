<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Śpiewnik Gitarowy PRO</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { scroll-behavior: auto !important; overflow-x: hidden; }
    .chord-mark { font-weight: bold; color: #ef4444; cursor: pointer; padding: 0 2px; }
    pre { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; word-break: break-word; line-height: 1.8; }
    .tab-block { font-family: 'Courier New', Courier, monospace; white-space: pre; overflow-x: auto; background: #0f172a; padding: 10px; border-radius: 8px; border-left: 3px solid #f59e0b; margin: 10px 0; color: #38bdf8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <header class="bg-slate-800 border-b border-slate-700 p-3 sticky top-0 z-40 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold text-amber-500">🎸 Śpiewnik PRO</h1>
    <div class="flex items-center gap-2">
      <span id="status-tag" class="text-xs text-slate-400 font-mono bg-slate-900 px-2 py-1 rounded border border-slate-700">Wczytywanie...</span>
      <button id="fullscreen-btn" class="bg-slate-700 text-amber-400 font-bold px-3 py-1 rounded-lg text-sm">⛶</button>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 flex flex-col gap-3">
    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-2">
      <input id="search-input" type="text" placeholder="🔍 Szukaj utworu..." class="flex-1 bg-slate-900 text-white border border-slate-700 rounded-lg p-2 text-sm outline-none">
      <select id="tag-filter" class="bg-slate-900 text-amber-400 border border-slate-700 rounded-lg p-2 text-sm outline-none">
        <option value="">Wszystkie tagi</option>
      </select>
    </div>

    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center gap-2">
      <button id="prev-song" class="bg-slate-700 text-amber-400 font-bold px-3 py-2 rounded-lg">◀</button>
      <select id="song-select" class="flex-1 bg-slate-900 text-white border border-slate-600 rounded-lg p-2 text-sm md:text-base outline-none"></select>
      <button id="next-song" class="bg-slate-700 text-amber-400 font-bold px-3 py-2 rounded-lg">▶</button>
    </div>

    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-400">Transpozycja:</span>
        <button id="trans-down" class="bg-slate-700 px-3 py-1 rounded font-bold">-</button>
        <span id="trans-val" class="font-bold text-amber-400 w-6 text-center">0</span>
        <button id="trans-up" class="bg-slate-700 px-3 py-1 rounded font-bold">+</button>
      </div>

      <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
        <button id="scroll-toggle" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded font-semibold">▶ Auto-Scroll</button>
        <input id="scroll-speed" type="range" min="1" max="10" value="3" class="w-16 accent-amber-500">
      </div>

      <div class="flex items-center gap-2 bg-slate-900 px-3 py-2 rounded-lg border border-slate-700">
        <button id="metronome-toggle" class="bg-sky-600 text-white text-xs px-3 py-1.5 rounded font-semibold">⏱ Metronom</button>
        <div class="flex items-center gap-1">
          <button id="bpm-minus" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-xs border border-slate-700">-</button>
          <input id="bpm-input" type="number" min="30" max="250" value="120" class="w-12 bg-slate-800 text-amber-400 font-bold text-xs text-center border border-slate-700 rounded p-0.5">
          <button id="bpm-plus" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-xs border border-slate-700">+</button>
        </div>
      </div>
    </div>

    <div id="song-display" class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex-1 min-h-[400px]">
      <div id="song-header" class="border-b border-slate-700 pb-3 mb-3">
        <h2 id="song-title" class="text-2xl font-bold text-amber-400"></h2>
        <p id="song-artist" class="text-slate-400 text-sm font-medium"></p>
        <p id="song-capo" class="text-xs text-slate-500 mt-1"></p>
        <div id="strumming-container" class="mt-2 text-xs text-amber-400 font-mono font-bold"></div>
      </div>
      <div id="song-body" class="text-sm md:text-lg text-slate-200 leading-relaxed"></div>
    </div>
  </main>

  <script>
    let songs = [];
    let filteredSongs = [];
    let currentSongId = '';
    let currentTranspose = 0;

    async function loadFolderDatabase() {
      try {
        const res = await fetch('songs/index.json');
        const fileList = await res.json();
        
        songs = await Promise.all(fileList.map(async (fileName, idx) => {
          const fileRes = await fetch(`songs/${fileName}`);
          const text = await fileRes.text();
          return parseSingleTxt(String(idx + 1), text);
        }));

        document.getElementById('status-tag').textContent = `${songs.length} utworów`;
      } catch (e) {
        document.getElementById('status-tag').textContent = "Błąd folderu songs/";
      }

      currentSongId = songs[0]?.id || '';
      updateTagFilterOptions();
      applyFilters();
    }

    function parseSingleTxt(id, text) {
      const parts = text.split(/\n---\n/);
      const metaLines = parts[0].split('\n');
      const body = parts[1] || parts[0];

      const song = { id, body: body.trim() };
      metaLines.forEach(line => {
        const [key, ...val] = line.split(':');
        if (key && val.length) {
          const v = val.join(':').trim();
          if (key.trim() === 'tags') song.tags = v.split(',').map(t => t.trim());
          else if (key.trim() === 'bpm') song.bpm = parseInt(v, 10);
          else song[key.trim()] = v;
        }
      });
      return song;
    }

    function applyFilters() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const selectedTag = document.getElementById('tag-filter').value.toLowerCase().trim();

      filteredSongs = songs.filter(s => {
        const matchesQuery = !query || s.title?.toLowerCase().includes(query) || s.artist?.toLowerCase().includes(query);
        const matchesTag = !selectedTag || (s.tags && s.tags.some(t => t.toLowerCase() === selectedTag));
        return matchesQuery && matchesTag;
      });

      if (filteredSongs.length > 0 && !filteredSongs.some(s => s.id === currentSongId)) {
        currentSongId = filteredSongs[0].id;
      }
      populateSelect();
      renderSong();
    }

    function populateSelect() {
      const songSelect = document.getElementById('song-select');
      songSelect.innerHTML = filteredSongs.map(s => `<option value="${s.id}">${s.artist || ''} - ${s.title || ''}</option>`).join('');
      songSelect.value = currentSongId;
    }

    function renderSong() {
      const song = songs.find(s => s.id === currentSongId);
      if (!song) return;

      document.getElementById('song-title').textContent = song.title || 'Bez tytułu';
      document.getElementById('song-artist').textContent = song.artist || '';
      document.getElementById('song-capo').textContent = song.capo || '';
      document.getElementById('trans-val').textContent = currentTranspose;
      if (song.bpm) document.getElementById('bpm-input').value = song.bpm;
      if (song.strumming) document.getElementById('strumming-container').textContent = `Bicie: ${song.strumming}`;

      let text = song.body;
      let formattedHtml = text.replace(/\[([A-G][^\]]*)\]/g, '<span class="chord-mark">[$1]</span>');
      document.getElementById('song-body').innerHTML = `<pre class="font-mono">${formattedHtml}</pre>`;
    }

    function updateTagFilterOptions() {
      const allTags = new Set();
      songs.forEach(s => (s.tags || []).forEach(t => allTags.add(t.trim().toLowerCase())));
      document.getElementById('tag-filter').innerHTML = '<option value="">Wszystkie tagi</option>' +
        Array.from(allTags).map(t => `<option value="${t}"># ${t.toUpperCase()}</option>`).join('');
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('tag-filter').addEventListener('change', applyFilters);
    document.getElementById('song-select').addEventListener('change', (e) => { currentSongId = e.target.value; renderSong(); });

    loadFolderDatabase();
  </script>
</body>
</html>
